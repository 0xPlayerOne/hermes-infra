name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, Format, Lint & Type Check
    if: github.event_name != 'pull_request' || github.head_ref != 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Ensure Rust components are installed
        run: |
          TOOLCHAIN="$(rustc --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          rustup component add rustfmt --toolchain "${TOOLCHAIN}" 2>&1 || true
          rustup component add clippy --toolchain "${TOOLCHAIN}" 2>&1 || true
          rustup component add llvm-tools-preview --toolchain "${TOOLCHAIN}" 2>&1 || true
      - name: Format check
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Type check
        run: cargo check
      - name: Build
        run: cargo build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Test
        run: cargo test
